<!DOCTYPE html>

<title>Interactive figure</title>
<style>
:root {
--tf-primary: #0072B2;
--tf-bg: #FFFFFF;
--tf-fg: #000000;
--tf-accent: #009E73;
--tf-muted: #56B4E9;
--tf-gray: #888888;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--tf-bg);
  color: var(--tf-fg);
  max-width: 1000px;
  margin: 24px auto;
  padding: 0 16px;
}
.tf-title { color: var(--tf-primary); }
.tf-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
  padding: 12px 16px;
  border: 1px solid var(--tf-primary);
  border-radius: 8px;
  margin-bottom: 16px;
}
.tf-control { display: flex; align-items: center; gap: 10px; }
.tf-control label { font-weight: 600; font-size: 14px; }
.tf-control input[type="range"] { accent-color: var(--tf-primary); width: 150px; }
.tf-control select.tf-param {
  background: var(--tf-bg);
  color: var(--tf-fg);
  border: 1px solid var(--tf-primary);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 14px;
}
.tf-value { min-width: 4.5em; font-variant-numeric: tabular-nums; font-size: 14px; }
figure { margin: 0; }
figure svg { max-width: 100%; height: auto; display: block; }
.tf-verdict-true { fill: var(--tf-accent, #009E73); color: var(--tf-accent, #009E73); }
.tf-verdict-false { fill: var(--tf-muted, #888888); color: var(--tf-muted, #888888); }
.tf-verdict-true .tf-readout-verdict { fill: var(--tf-accent, #009E73); }
.tf-verdict-false .tf-readout-verdict { fill: var(--tf-muted, #888888); }
</style>

  </div>
  <div class="tf-control">
    <label for="tf-p-d">Thickness (d)</label>
    <input type="range" class="tf-param" data-name="d" id="tf-p-d" min="50" max="200" step="1" value="100">
    <output class="tf-value" data-name="d" data-unit="nm" for="tf-p-d">100 nm</output>
  </div>

    <input type="range" class="tf-param" data-name="lam" id="tf-p-lam" min="400" max="800" step="1" value="550">

  </div>
  <div class="tf-control">
    <label for="tf-p-state">State</label>
    <select class="tf-param" data-name="state" id="tf-p-state">

      <option value="bare">bare</option>
